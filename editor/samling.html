<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rediger | Admin</title>
<!-- Redigeringssiden for samlinger: liste, nytt innlegg, rediger, slett.
     Kopiert til dist/admin/ av bygget. Fargene arves fra sidens tokens.css. -->
<link rel="stylesheet" href="/css/tokens.css">
<style>
  :root{
    --a:var(--adm-aksent,#3d6be0); --fare:var(--adm-fare,#c0392b); --ok:var(--adm-ok,#3f9f6b);
    --blekk:#1d1d1b; --dempet:#5d5d58; --linje:#dddcd6; --flate:#f6f5f1; --hvit:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--flate);color:var(--blekk);font:18px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--a);outline-offset:2px}
  .topp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--hvit);border-bottom:1px solid var(--linje)}
  .topp a,.lenkeknapp{color:var(--dempet);font-size:16px;min-height:44px;display:inline-flex;align-items:center;background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  main{max-width:760px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:28px;line-height:1.2;margin-bottom:22px}
  .stor{display:flex;width:100%;align-items:center;justify-content:center;min-height:68px;padding:0 24px;border:0;border-radius:14px;background:var(--a);color:#fff;font-size:20px;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .stor:disabled{opacity:.55;cursor:wait}
  .knapp{min-height:48px;padding:0 18px;border:1px solid var(--linje);border-radius:10px;background:var(--hvit);cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--blekk)}
  .knapp--fare{color:var(--fare);border-color:currentColor}
  .melding{min-height:1.5em;margin:18px 0;font-size:17px}
  .melding--feil{color:var(--fare)} .melding--ok{color:var(--ok)}
  .liste{list-style:none;display:grid;gap:14px;margin-top:26px}
  .rad{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:14px;background:var(--hvit);border:1px solid var(--linje);border-radius:14px}
  .rad img,.rad .tom{width:96px;height:96px;object-fit:cover;border-radius:10px;background:var(--flate)}
  .rad h2{font-size:19px;line-height:1.25;margin-bottom:4px}
  .rad p{color:var(--dempet);font-size:16px}
  .rad .knapper{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .merke{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--flate);border:1px solid var(--linje);margin-left:6px;vertical-align:2px}
  .felt{display:block;margin-bottom:24px;border:0;min-width:0}
  .felt>span{display:block;font-weight:600;margin-bottom:6px}
  .felt small{display:block;color:var(--dempet);font-size:15px;margin:-2px 0 8px}
  .felt input[type=text],.felt input[type=password],.felt textarea{width:100%;padding:14px;border:1px solid var(--linje);border-radius:10px;background:var(--hvit);font-size:18px}
  .felt textarea{resize:vertical}
  .valg{display:flex;flex-wrap:wrap;gap:10px}
  .valg label{flex:1 1 140px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 16px;border:2px solid var(--linje);border-radius:12px;background:var(--hvit);cursor:pointer;font-weight:600}
  .valg input{width:20px;height:20px;accent-color:var(--a)}
  .valg label:has(input:checked){border-color:var(--a)}
  .bilde{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .bilde img{width:160px;height:160px;object-fit:cover;border-radius:12px;background:var(--hvit)}
  .galleri{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:12px}
  .galleri figure{position:relative}
  .galleri img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block}
  .galleri button{position:absolute;top:6px;right:6px;min-height:36px;padding:0 12px;border:0;border-radius:99px;background:rgba(0,0,0,.72);color:#fff;font-size:14px;cursor:pointer}
  .avkryss{display:flex;gap:12px;align-items:center;min-height:48px;margin-bottom:28px;cursor:pointer}
  .avkryss input{width:22px;height:22px;accent-color:var(--a)}
  .handlinger{display:grid;gap:12px}
  .slett{margin-top:40px;padding-top:24px;border-top:1px solid var(--linje)}
  .ferdig{text-align:center;padding:30px 0}
  .ferdig p{margin-bottom:22px}
  .ferdig .knapper{display:grid;gap:12px}
  [hidden]{display:none!important}
  @media(max-width:520px){h1{font-size:24px}.rad{grid-template-columns:72px 1fr}.rad img,.rad .tom{width:72px;height:72px}}
</style>
</head>
<body>
<header class="topp">
  <a href="/">‹ Til nettsiden</a>
  <button type="button" class="lenkeknapp" id="loggut" hidden>Logg ut</button>
</header>
<main id="samling-app" aria-live="polite"></main>
<script src="/admin/samling.js"></script>
</body>
</html>
